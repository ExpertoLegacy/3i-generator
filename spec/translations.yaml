# ---- Preliminaries and Chapter 1 ---------------------------------------------------------------
"Research title": "Pamagat ng pananaliksik"
"Pattern: SYSTEM NAME: A Platform Type of System for Users of Locale. About 20 words.": "Halimbawang ayos ng pamagat. Mga 20 salita."
"People and offices to thank": "Mga tao at opisinang pasasalamatan"
"Who": "Sino"
"What they did": "Ang kanilang ginawa"
"Abstract notes": "Mga tala para sa abstract"
"Write last. One paragraph of 150 to 250 words, past tense.": "Isulat ito sa huli. Isang talata na may 150 hanggang 250 salita."
"Keywords, 3 to 5": "Mga susing salita, 3 hanggang 5"
"Context: the problem area, globally and in the Philippines, with sources": "Ang paksa at ang papel ng teknolohiya, sa buong mundo at sa Pilipinas, kasama ang mga sanggunian."
"Current situation at the locale: how, who, how often, with evidence": "Paano ito ginagawa ngayon sa inyong locale, sino ang gumagawa, gaano kadalas, at ano ang patunay."
"Specific problems encountered": "Anong mga tiyak na problema ang nararanasan?"
"Why existing solutions fall short at your locale": "Bakit hindi sapat ang mga kasalukuyang solusyon sa inyong locale?"
"Proposed solution and who benefits": "Ano ang iminumungkahing sistema at sino ang makikinabang?"
"Alignment with your class research agenda and DepEd Order No. 39, s. 2016": "Paano ito tumutugma sa research agenda ng klase at sa DepEd Order No. 39, s. 2016?"
"Research questions": "Mga tanong sa pananaliksik"
"Question": "Tanong"
"Sub-items, one per line (optional)": "Mga bahagi ng tanong, isa bawat linya (opsiyonal)"
"Specific objectives, one per line, matching your questions in order": "Mga tiyak na layunin, isa bawat linya, kasunod ng mga tanong"
"Each objective restates a research question and starts with an action verb. Build this part after the Statement of the Problem.": "Bawat layunin ay katumbas ng isang tanong at nagsisimula sa pandiwa."
"Level of significance": "Antas ng kabuluhan"
"Input: knowledge, software, and hardware requirements": "Input: kaalaman, software, at hardware na kailangan"
"Process: phases of your model and evaluation": "Proseso: mga yugto ng modelo at ebalwasyon"
"Output: the developed and evaluated system": "Output: ang nabuo at nasuring sistema"
"IPO diagram": "Diagram ng Input-Process-Output"
"Scope: modules, roles, platform, locale, respondents, school year": "Saklaw: mga module, gagamit, plataporma, lugar, respondente, at taong panuruan"
"Limitations: what the system will not do, and constraints": "Limitasyon: ang hindi gagawin ng sistema"
"Beneficiaries, most direct first": "Mga makikinabang, simula sa pinakadirekta"
"Beneficiary": "Makikinabang"
"How the system will specifically help them": "Paano sila partikular na matutulungan ng sistema"
"Terms": "Mga termino"
"Term": "Termino"
"How the term is used in your study": "Paano ginamit ang termino sa inyong pag-aaral"

